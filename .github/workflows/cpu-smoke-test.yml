name: CPU Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    name: CPU Application Smoke Test
    runs-on: ubuntu-latest

    env:
      PADDLE_ENABLED: "false"
      PADDLE_DEVICE: "cpu"

      UNLIMITED_OCR_ENABLED: "false"
      UNLIMITED_OCR_MODE: "pipeline"

      SUPERVISOR_ENABLED: "false"
      SUPERVISOR_ON_CONFLICT: "false"

      TESSERACT_ENABLED: "true"
      TESSERACT_PSM: "6"
      TESSERACT_ALT_PSM: "11"

      OCR_DPI: "180"
      TRIAGE_DPI: "72"
      DEEP_PAGE_WINDOW: "2"

      OCR_CONFIDENCE_THRESHOLD: "0.80"
      SUPERVISOR_CONFIDENCE_THRESHOLD: "0.90"
      AMOUNT_TOLERANCE: "0.01"

      ALLOW_INVENTED_MASTER_VALUES: "false"
      STORE_EVIDENCE: "true"
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile source
        run: |
          python -m compileall -q src

      - name: Run tests
        run: |
          pytest -q

      - name: Verify application import
        run: |
          python -c "import src.main; print('src.main import: OK')"
